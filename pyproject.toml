[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filework-agent"
version = "0.1.0"
description = "A file assistant with evidence-backed invoice reports and task-level evaluation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "reportlab>=4,<5"]

[project.scripts]
filework = "filework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filework = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
